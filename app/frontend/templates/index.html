<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Newsletters - Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 1rem;
        }

        .google-btn:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
        }

        .google-btn:active {
            transform: translateY(0);
        }

        .google-icon {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #4285f4;
        }

        .features {
            margin-top: 2rem;
            text-align: left;
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            color: #666;
        }

        .feature-icon {
            width: 20px;
            height: 20px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .loading {
            display: none;
            margin-top: 1rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4285f4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #e74c3c;
            margin-top: 1rem;
            padding: 10px;
            background: #fdf2f2;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📧 Smart Newsletters</div>
        <div class="subtitle">Gestiona tus newsletters de manera inteligente</div>
        
        <button class="google-btn" onclick="signInWithGoogle()">
            <div class="google-icon">G</div>
            Iniciar sesión con Google
        </button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Conectando con Google...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Acceso seguro a tu Gmail</span>
            </div>
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Análisis inteligente de newsletters</span>
            </div>
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Gestión automática de suscripciones</span>
            </div>
        </div>
    </div>

    <script>
        function signInWithGoogle() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            // Show loading state
            loading.style.display = 'block';
            error.style.display = 'none';
            
            // Redirect to Google OAuth
            window.location.href = '/auth/google';
        }

        // Check for error parameters in URL
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            
            if (error) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error de autenticación: ' + error;
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
